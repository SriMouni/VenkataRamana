<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a6b"/><stop offset="0.45" stop-color="#ffc27a"/><stop offset="0.75" stop-color="#ffe3a8"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/><stop offset="0.6" stop-color="#ffdf7e"/><stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc63f"/><stop offset="1" stop-color="#4f8a2b"/></linearGradient>
    <linearGradient id="field2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fae3a"/><stop offset="1" stop-color="#3b6e23"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0"/><stop offset="1" stop-color="#f3a76b"/></linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#sky)"/>
  <!-- sun -->
  <circle cx="230" cy="190" r="110" fill="url(#sun)">
    <animate attributeName="r" values="104;116;104" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="190" r="46" fill="#fff3c4"/>
  <!-- birds -->
  <g fill="none" stroke="#7a3b22" stroke-width="2.4" stroke-linecap="round">
    <path d="M80 110q8-8 16 0q8-8 16 0">
      <animateTransform attributeName="transform" type="translate" values="0 0;30 -8;0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M118 135q6-6 12 0q6-6 12 0">
      <animateTransform attributeName="transform" type="translate" values="0 0;24 -4;0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M300 95q5-5 10 0q5-5 10 0">
      <animateTransform attributeName="transform" type="translate" values="0 0;-20 6;0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- distant hills -->
  <path d="M0 270 Q60 225 120 255 T240 245 T400 250 V320 H0z" fill="#d9825a" opacity="0.55"/>
  <path d="M0 290 Q80 250 170 280 T330 270 T400 280 V330 H0z" fill="#b7663f" opacity="0.6"/>
  <!-- river -->
  <path d="M0 320 H400 V350 Q300 340 200 352 T0 346z" fill="url(#water)"/>
  <!-- paddy fields -->
  <path d="M0 345 Q120 335 220 350 T400 342 V500 H0z" fill="url(#field1)"/>
  <path d="M0 400 Q140 380 260 405 T400 395 V500 H0z" fill="url(#field2)"/>
  <g stroke="#a7d65c" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M20 420v-14M34 425v-16M48 418v-12M62 428v-15M300 430v-14M316 426v-16M332 432v-13M346 424v-15M360 431v-14"/>
    <path d="M90 470v-18M108 476v-20M126 468v-16M240 478v-18M258 470v-20M276 476v-16"/>
  </g>
  <!-- palm trees -->
  <g>
    <path d="M318 352 C316 300 322 260 330 220" stroke="#6b3d22" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#3f7a2a">
      <path d="M330 222 q-40-10-62 12 q30-6 62-8z"/>
      <path d="M330 222 q40-14 64 6 q-32-2-64-2z"/>
      <path d="M330 222 q-26-30-56-28 q30 10 56 32z"/>
      <path d="M330 222 q24-32 56-30 q-32 12-56 34z"/>
      <path d="M330 222 q-4-34 10-50 q-2 26-6 52z"/>
      <animateTransform attributeName="transform" type="rotate" values="-2 330 222;3 330 222;-2 330 222" dur="5s" repeatCount="indefinite"/>
    </g>
    <path d="M360 350 C360 315 364 290 370 265" stroke="#6b3d22" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g fill="#4d8c31">
      <path d="M370 266 q-30-6-46 8 q22-4 46-5z"/>
      <path d="M370 266 q30-10 46 4 q-24-1-46 0z"/>
      <path d="M370 266 q-18-22-40-20 q22 8 40 24z"/>
      <path d="M370 266 q18-24 40-22 q-24 9-40 26z"/>
      <animateTransform attributeName="transform" type="rotate" values="2 370 266;-3 370 266;2 370 266" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- hut -->
  <g>
    <rect x="58" y="318" width="74" height="44" fill="#e7b277"/>
    <path d="M46 322 L95 282 L144 322z" fill="#9b5a2e"/>
    <path d="M52 322 L95 288 L138 322" fill="none" stroke="#c98a4b" stroke-width="3"/>
    <rect x="86" y="334" width="18" height="28" fill="#6b3d22"/>
    <rect x="66" y="332" width="12" height="11" fill="#fff0c4"/>
    <rect x="112" y="332" width="12" height="11" fill="#fff0c4"/>
  </g>
  <!-- farmer silhouette with plough & ox -->
  <g fill="#4a2a18" transform="translate(150 392)">
    <ellipse cx="62" cy="-6" rx="30" ry="14"/>
    <rect x="40" y="2" width="5" height="18"/><rect x="52" y="2" width="5" height="18"/><rect x="70" y="2" width="5" height="18"/><rect x="80" y="2" width="5" height="18"/>
    <path d="M90 -12 q14 -6 18 4 q-6 6 -16 4z"/>
    <path d="M100 -18 l6 -8 M94 -18 l-2 -9" stroke="#4a2a18" stroke-width="2.5"/>
    <path d="M32 -6 L0 12" stroke="#4a2a18" stroke-width="3"/>
    <circle cx="-8" cy="-26" r="6"/>
    <path d="M-12 -20 h9 l3 18 h-15z"/>
    <path d="M-10 -2 l-4 20 M-2 -2 l3 20" stroke="#4a2a18" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M-4 -16 L6 6" stroke="#4a2a18" stroke-width="3" stroke-linecap="round"/>
    <path d="M-16 -30 q8 -8 16 0z"/>
  </g>
</svg>
