<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maharshi Ramana | Telugu Stories &amp; Cartoons</title>
  <meta name="description" content="Telugu short stories and cartoons by actor and writer Maharshi Ramana — about farmers and film sets, family and village life." />
  <meta name="color-scheme" content="light dark" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Maharshi Ramana" />
  <meta property="og:title" content="Maharshi Ramana | Telugu Stories &amp; Cartoons" />
  <meta property="og:description" content="Stories from real life, told in Telugu. Read, enjoy and share." />
  <meta property="og:url" content="https://srimouni.github.io/VenkataRamana/" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg" />
  <script>
    (function () {
      var t; try { t = localStorage.getItem("theme"); } catch (e) {}
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="progress" id="progress"></div>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a href="#/" class="brand" aria-label="Maharshi Ramana home">
        <img class="brand-mark" src="assets/logo-mark.svg" alt="" />
        <span class="brand-text">
          <span class="brand-name">Maharshi Ramana</span>
          <span class="brand-sub">Stories · Cartoons</span>
        </span>
      </a>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="#/" data-scroll="stories">Stories</a>
        <a href="#/" data-scroll="cartoons">Cartoons</a>
        <a href="#/" data-scroll="about">About</a>
        <a href="#/" data-scroll="gallery">Gallery</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" id="themeBtn" type="button" aria-label="Switch theme">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a href="#/" data-scroll="stories" class="btn btn-sm btn-gradient hide-mobile">Read stories</a>
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="#/" class="brand" aria-label="Maharshi Ramana home">
        <img class="brand-mark" src="assets/logo-mark.svg" alt="" />
        <span class="brand-text"><span class="brand-name">Maharshi Ramana</span><span class="brand-sub">Stories · Cartoons</span></span>
      </a>
      <nav class="footer-nav" aria-label="Footer">
        <a href="#/" data-scroll="stories">Stories</a>
        <a href="#/" data-scroll="cartoons">Cartoons</a>
        <a href="#/" data-scroll="about">About</a>
        <a href="#/" data-scroll="gallery">Gallery</a>
      </nav>
      <p class="footer-quote">“కష్టం అనేది ప్రతీ వృత్తిలోనూ ఉంటుంది.. కష్టం లేకుండా ఏ జీవి... ఏ ప్రాణి ఉండదు.”</p>
      <p class="copyright">© <span id="year"></span> Maharshi Ramana. If a story moves you, share it 🙏</p>
    </div>
  </footer>

  <dialog id="lightbox" class="lightbox">
    <button class="lb-btn lb-close" type="button" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous">‹</button>
    <figure><img id="lbImg" alt="" /><figcaption id="lbCap"></figcaption></figure>
    <button class="lb-btn lb-next" type="button" aria-label="Next">›</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
